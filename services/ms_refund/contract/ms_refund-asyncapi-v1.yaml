asyncapi: 2.6.0
info:
  title: MS Refund Saga Events
  version: 1.0.0
  description: |
    Contrato AMQP de los eventos publicados y consumidos por MS Refund.
    SAGA_EXCHANGE configura el exchange; por defecto es booking.saga.v1.
    Los mensajes publicados usan el sobre NestJS {pattern, data}; data contiene
    el evento de dominio. El routing key es el tipo de evento.
defaultContentType: application/json
servers:
  local:
    url: amqp://localhost:5672
    protocol: amqp
    description: Broker AMQP; configurar credenciales mediante variables de entorno.
channels:
  saga/reembolso.solicitado:
    description: Publicacion persistente en SAGA_EXCHANGE con routing key reembolso.solicitado.
    publish:
      operationId: publicarSolicitudReembolso
      message:
        $ref: '#/components/messages/ReembolsoSolicitadoEnvelope'
  saga/pago.reembolsado:
    description: Consumo desde la cola Saga de ms_refund con routing key pago.reembolsado.
    subscribe:
      operationId: consumirReembolsoConfirmado
      message:
        $ref: '#/components/messages/PagoReembolsadoEnvelope'
components:
  messages:
    ReembolsoSolicitadoEnvelope:
      name: ReembolsoSolicitadoEnvelope
      title: Solicitud de reembolso publicada por MS Refund
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReembolsoSolicitadoEnvelope'
    PagoReembolsadoEnvelope:
      name: PagoReembolsadoEnvelope
      title: Confirmacion de reembolso publicada por MS Payment
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PagoReembolsadoEnvelope'
  schemas:
    ReembolsoSolicitadoEnvelope:
      type: object
      additionalProperties: false
      required: [pattern, data]
      properties:
        pattern:
          type: string
          const: reembolso.solicitado
        data:
          $ref: '#/components/schemas/ReembolsoSolicitado'
    ReembolsoSolicitado:
      type: object
      additionalProperties: false
      required: [eventoId, tipo, fechaISO, origen, correlationId, data]
      properties:
        eventoId:
          type: string
          format: uuid
        tipo:
          type: string
          const: reembolso.solicitado
        fechaISO:
          type: string
          format: date-time
        origen:
          type: string
          const: ms_refund
        correlationId:
          type: string
          format: uuid
        data:
          type: object
          additionalProperties: false
          required: [pag_id, rem_id, rem_numero, rem_monto]
          properties:
            pag_id:
              $ref: '#/components/schemas/BigId'
            rem_id:
              $ref: '#/components/schemas/BigId'
            rem_numero:
              type: string
              minLength: 1
              maxLength: 30
            rem_monto:
              type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            rem_motivo:
              type: [string, 'null']
              maxLength: 300
    PagoReembolsadoEnvelope:
      type: object
      additionalProperties: false
      required: [pattern, data]
      properties:
        pattern:
          type: string
          const: pago.reembolsado
        data:
          $ref: '#/components/schemas/PagoReembolsado'
    PagoReembolsado:
      type: object
      additionalProperties: true
      required: [eventoId, tipo, fechaISO, origen, correlationId, data]
      properties:
        eventoId:
          type: string
          minLength: 1
          maxLength: 128
        tipo:
          type: string
          const: pago.reembolsado
        fechaISO:
          type: string
          format: date-time
        origen:
          type: string
          minLength: 1
          maxLength: 80
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: object
          additionalProperties: true
          properties:
            rem_referencia:
              type: string
              description: Si es string, MS Refund lo guarda truncado a 100 caracteres.
    BigId:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
