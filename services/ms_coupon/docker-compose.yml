services:
  postgres:
    image: postgres:16
    container_name: pg_ms_coupon
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ms_coupon
    ports:
      - '5432:5432'
    volumes:
      - pg_ms_coupon_data:/var/lib/postgresql/data
      - type: bind
        source: ./init-coupon.sql
        target: /docker-entrypoint-initdb.d/02_ms_coupon.sql
        bind:
          create_host_path: false
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ms_coupon']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_ms_coupon_data:
